name: Build Windows release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Windows installer
        shell: pwsh
        run: |
          $maxAttempts = 2
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            $logPath = "build-attempt-$attempt.log"
            npm run dist:win 2>&1 | Tee-Object -FilePath $logPath
            $buildExitCode = $LASTEXITCODE
            if ($buildExitCode -eq 0) { exit 0 }
            if ($attempt -lt $maxAttempts) {
              Write-Warning "Build attempt $attempt failed; retrying transient downloads in 15 seconds"
              Start-Sleep -Seconds 15
            }
          }
          $tail = (Get-Content -LiteralPath $logPath -Tail 50) -join "`n"
          $tail = $tail.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
          Write-Output "::error title=Windows release build failed::$tail"
          exit $buildExitCode

      - name: Create checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath release -Filter "券来-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not generated" }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
          $checksum = Join-Path $installer.DirectoryName "$($installer.Name).sha256"
          "$hash  $($installer.Name)" | Set-Content -LiteralPath $checksum -Encoding utf8

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem -LiteralPath release -Filter "券来-Setup-*.exe" | Select-Object -First 1
          $checksum = "$($installer.FullName).sha256"
          gh release create $env:GITHUB_REF_NAME $installer.FullName $checksum --verify-tag --generate-notes --title "券来 $env:GITHUB_REF_NAME"
